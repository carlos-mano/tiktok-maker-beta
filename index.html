<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 TikTok Maker - Beta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .beta-tag {
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        .logout-btn {
            background: #6c757d;
            margin-top: 10px;
        }

        .progress-container {
            background: #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #666;
            margin: 5px 0;
        }

        .job-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
        }

        .loading {
            color: #667eea;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tela de Login -->
        <div id="loginScreen">
            <div class="logo">🎬</div>
            <h1>TikTok Maker</h1>
            <div class="beta-tag">BETA FECHADO</div>
            <p class="subtitle">Acesso restrito para convidados</p>
            
            <div class="form-group">
                <label for="email">Email autorizado:</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <button class="btn" onclick="login()">Entrar no Beta</button>
            
            <div id="loginMessage" class="hidden"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="logo">🚀</div>
            <h1>Pronto para criar!</h1>
            
            <div class="user-info">
                <strong>Usuário:</strong> <span id="userEmail"></span>
                <button class="btn logout-btn" onclick="logout()">Sair</button>
            </div>

            <div class="form-group">
                <label for="videoUrl">URL do YouTube:</label>
                <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=..." required>
            </div>

            <div class="form-group">
                <label for="observations">Observações (opcional):</label>
                <textarea id="observations" placeholder="Alguma parte específica que quer destacar?"></textarea>
            </div>

            <button class="btn" onclick="processVideo()">👉 Criar TikTok Automático</button>
            
            <!-- Área de Progresso -->
            <div id="progressContainer" class="progress-container hidden">
                <h3>🎬 Processando seu vídeo...</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Iniciando processamento...</div>
                <div class="progress-text" id="jobIdText"></div>
                
                <div class="job-info">
                    <strong>Status:</strong> <span id="statusText">Carregando...</span><br>
                    <strong>Progresso:</strong> <span id="progressPercent">0%</span><br>
                    <strong>Tempo:</strong> <span id="timeElapsed">0s</span>
                </div>
            </div>
            
            <div id="processMessage" class="hidden"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Usuários autorizados para o beta
        const authorizedUsers = [
            'amigo1@gmail.com',
            'amigo2@gmail.com', 
            'amigo3@gmail.com'
        ];

        let currentJobId = null;
        let progressInterval = null;
        let startTime = null;

        async function login() {
            const email = document.getElementById('email').value.toLowerCase().trim();
            const messageDiv = document.getElementById('loginMessage');
            
            if (!email) {
                showMessage(messageDiv, 'Por favor, insira um email.', 'error');
                return;
            }

            if (authorizedUsers.includes(email)) {
                localStorage.setItem('userEmail', email);
                showDashboard();
                showMessage(messageDiv, '✅ Acesso liberado! Bem-vindo ao beta.', 'success');
            } else {
                showMessage(messageDiv, '❌ Email não autorizado. Beta fechado para convidados.', 'error');
            }
        }

        async function processVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const observations = document.getElementById('observations').value.trim();
            const userEmail = localStorage.getItem('userEmail');
            const messageDiv = document.getElementById('processMessage');
            const btn = document.querySelector('#dashboard .btn');
            const progressContainer = document.getElementById('progressContainer');

            if (!url) {
                showMessage(messageDiv, 'Por favor, insira uma URL do YouTube.', 'error');
                return;
            }

            if (!userEmail) {
                showMessage(messageDiv, 'Sessão expirada. Faça login novamente.', 'error');
                return;
            }

            // Limpar estado anterior
            resetProgress();
            messageDiv.classList.add('hidden');

            // Mostrar área de progresso
            progressContainer.classList.remove('hidden');
            btn.disabled = true;
            btn.textContent = '⏳ Processando...';
            
            updateProgress(0, 'Enviando vídeo para processamento...');

            try {
                // Chamar API REAL para processar vídeo
                const response = await fetch(API_BASE + '/api/process-video', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        videoUrl: url,
                        observations: observations
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentJobId = data.jobId;
                    startTime = new Date();
                    
                    updateProgress(10, 'Vídeo recebido. Iniciando processamento...');
                    document.getElementById('jobIdText').textContent = `ID: ${data.jobId}`;
                    
                    // Iniciar verificação de progresso
                    startProgressChecking();
                    
                } else {
                    showMessage(messageDiv, `❌ Erro: ${data.error}`, 'error');
                    resetProgress();
                }
            } catch (error) {
                showMessage(messageDiv, '❌ Erro de conexão com o servidor.', 'error');
                resetProgress();
            }
        }

        function startProgressChecking() {
            // Verificar progresso a cada 3 segundos
            progressInterval = setInterval(checkProgress, 3000);
        }

        async function checkProgress() {
            if (!currentJobId) return;

            try {
                const response = await fetch(API_BASE + '/api/status/' + currentJobId);
                const job = await response.json();

                if (response.ok) {
                    updateProgressUI(job);
                    
                    // Se terminou, parar de verificar
                    if (job.status === 'completed' || job.status === 'failed') {
                        clearInterval(progressInterval);
                        onProcessingComplete(job);
                    }
                }
            } catch (error) {
                console.error('Erro ao verificar progresso:', error);
            }
        }

        function updateProgressUI(job) {
            const progress = job.progress || 0;
            const status = job.status || 'pending';
            const message = getStatusMessage(status, progress);
            
            updateProgress(progress, message);
            document.getElementById('statusText').textContent = getStatusText(status);
            document.getElementById('progressPercent').textContent = progress + '%';
            
            // Atualizar tempo decorrido
            if (startTime) {
                const elapsed = Math.floor((new Date() - startTime) / 1000);
                document.getElementById('timeElapsed').textContent = elapsed + 's';
            }
        }

        function getStatusMessage(status, progress) {
            const messages = {
                'pending': 'Na fila de processamento...',
                'processing': `Processando... ${progress}%`,
                'downloading': 'Baixando vídeo do YouTube...',
                'transcribing': 'Transcrevendo áudio...',
                'analyzing': 'Analisando conteúdo...',
                'clipping': 'Cortando trechos...',
                'completed': 'Processamento concluído!',
                'failed': 'Erro no processamento'
            };
            
            return messages[status] || `Processando... ${progress}%`;
        }

        function getStatusText(status) {
            const statusTexts = {
                'pending': '⏳ Na fila',
                'processing': '🔄 Processando',
                'downloading': '📥 Baixando',
                'transcribing': '🎙️ Transcrevendo',
                'analyzing': '🔍 Analisando',
                'clipping': '✂️ Cortando',
                'completed': '✅ Concluído',
                'failed': '❌ Falhou'
            };
            
            return statusTexts[status] || status;
        }

        function onProcessingComplete(job) {
            const btn = document.querySelector('#dashboard .btn');
            const messageDiv = document.getElementById('processMessage');
            
            btn.disabled = false;
            btn.textContent = '👉 Criar TikTok Automático';
            
            if (job.status === 'completed') {
                showMessage(messageDiv, '🎉 Processamento concluído! Em breve: download dos vídeos!', 'success');
                updateProgress(100, 'Processamento concluído com sucesso!');
            } else {
                showMessage(messageDiv, '❌ Erro no processamento do vídeo.', 'error');
            }
        }

        function updateProgress(percent, message) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = message;
        }

        function resetProgress() {
            const btn = document.querySelector('#dashboard .btn');
            const progressContainer = document.getElementById('progressContainer');
            
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            
            currentJobId = null;
            startTime = null;
            
            btn.disabled = false;
            btn.textContent = '👉 Criar TikTok Automático';
            progressContainer.classList.add('hidden');
            
            updateProgress(0, '');
            document.getElementById('jobIdText').textContent = '';
            document.getElementById('statusText').textContent = '';
            document.getElementById('progressPercent').textContent = '';
            document.getElementById('timeElapsed').textContent = '';
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userEmail').textContent = localStorage.getItem('userEmail');
            resetProgress();
        }

        function logout() {
            localStorage.removeItem('userEmail');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('email').value = '';
            resetProgress();
        }

        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = type + '-message';
            element.classList.remove('hidden');
        }

        // Verifica se usuário já está logado
        window.onload = function() {
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail && authorizedUsers.includes(userEmail)) {
                showDashboard();
            }
        }
    </script>
</body>
</html>
